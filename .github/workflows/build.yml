# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: test release tools and portable defaults
        env:
          AURORA_MINECRAFT: ${{ matrix.minecraft }}
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: build
        run: python3 tools/parity.py --minecraft '${{ matrix.minecraft }}'
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-${{ matrix.minecraft }}
          path: build/minecraft-${{ matrix.minecraft }}/libs/
