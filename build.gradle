plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "IzzelAliz Maven"
		url = "https://maven.izzel.io/releases/"
	}
	mavenCentral()
	maven { url = "https://jitpack.io" }
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
		content {
			includeGroup 'fuzs.forgeconfigapiport'
		}
	}
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

loom {
	splitEnvironmentSourceSets()
	enableTransitiveAccessWideners = true

	runConfigs.configureEach {
		// Disables the strict version validation check inside the development sandbox env
		property "fabric.skipDependencyCheck", "true"
		vmArg "-Dfabric.skipDependencyCheck=true"
		property "fabric.modVersion.minecraft", "1.21.11"
		vmArg "-Dfabric.modVersion.minecraft=1.21.11"
	}

	mods {
		"aurora" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation sourceSets.client.output
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
	useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	inputs.property "version", version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

afterEvaluate {
	runClient {
		jvmArgs "-Dfabric.skipDependencyCheck=true", "-Dfabric.modVersion.minecraft=1.21.11"
	}
}

java {
	// NOTE: `withSourcesJar()` is intentionally DISABLED.
	// A `*-sources.jar` contains raw .java files, not compiled .class files. If it is
	// accidentally placed in a Minecraft `mods/` folder, Fabric/Mixin will try to load it
	// as a real mod and crash with `ClassNotFoundException` on every mixin class during
	// preLaunch (this was the root cause of the c2me/aurora startup crash).
	// Re-enable only if you need sources for maven publishing, and never ship it to players.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
